  - number: 1
    purpose: 入社後に一日中座りっぱなしで太り、食べることとタバコが楽しみになった日常を伝える
    visual: 白い余白を残したオフィスのデスク。中央で、以前より少しふっくらと丸くなった淡い青緑の豆型胴体と楕円の顔を持つ主人公が、デスクに座っておにぎりを幸せそうに頬張っている。机の上にはCRTモニター、灰皿に置かれたタバコから立ち上る紫煙、菓子パンの包み。上部中央には手描きの歪んだ白いフキダシがあり、縦書きで『一日中座りっぱなし… 食べるのだけが 唯一の楽しみ…！』と入る。棒人間にはしない。
    narration: |-
      入社したら太りました。
      一日中机に座ってパソコンに向かっていますし、当時の唯一の楽しみが食べることになりました。
      お酒は飲みませんでしたが、タバコは吸ってました。
    dialogue: 一日中座りっぱなし…\n食べるのだけが\n唯一の楽しみ…！
