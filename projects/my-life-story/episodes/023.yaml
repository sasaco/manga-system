panels:
  - number: 1
    purpose: 仕事を続けられる保証がないまま幼い子を支える怖さを、仕事机・眠る子供・手を止めた私の視線と短い言葉で伝える
    visual: 右に無地のパソコン画面と資料を置いた仕事机、その手前に淡い青緑の丸い胴体の若い私。片手は仕事机に残したまま、左下の小さなベビーベッドへ振り向いて手を止める。ベッドには黄色のおくるみに包まれた幼い子が眠る。子供に向けた視線、下がった眉、小さな汗で不安を表す。上部に大きな吹き出しを一つ置き、働き続けられるかという短い言葉をKritaで入れる。本文末尾で47歳の現在へ戻る。一コマのみ。歪んだ楕円の顔と面積のある豆形の胴体を使い、棒人間にはしない。
    narration: |-
      子育てには20年かかる。でも、仕事が20年間順調に続く保証はない。

      早いうちに家族ができた私は、自分の仕事に家族の運命がかかっていると思うと、怖かったです。
      もともとはボーッとした人だったのに、子供が生まれてからは、何やら必死でした。

      47歳になった今、子供も大きくなりました。
      無事に子育てを終えられそうです。
    dialogue: |-
      この子が
      大きくなるまで
      仕事、続くかな…
