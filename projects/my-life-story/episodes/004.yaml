  - number: 1
    purpose: "徹夜の事務所で単純作業に加わった新人が、これを社会人の普通だと思って絶望した記憶を伝える"
    visual: "白い余白を生かした深夜の事務所の一場面。少し歪んだ楕円の顔と丸い豆形・カプセル形の胴体を持つ師匠、パートの方、若い主人公の3人が、長机に並んで座っている。温かい灰色の大きな胴体と太い眉の師匠、くすんだ黄色の丸い胴体を持つパートの方は、疲れた顔で紙の束に向かっている。中央の主人公は淡い青緑の丸い縦長胴体と小さなネクタイで、鉛筆を計算書の右上へ置いたまま、楽しさが消えて呆然とした表情をしている。机には番号を書き入れる前の白紙の計算書が何束も積まれ、3人の鉛筆の位置だけで右上へ順番に記入する作業を示す。窓の暗い夜空、小さな月、卓上灯と湯気のないカップだけで徹夜を示す。紙面はすべて白紙にし、文字、数字、記号は描かない。棒人間や一本線の脚にはしない。"
    narration: |-
      師匠やパートの方が、徹夜して働くこともありました。
      私もその輪に混じり、計算書の右上にページ番号を手書きする作業をしていました。

      最初は少し楽しかったのですが、
      「これが社会人として普通なんだ」と思った瞬間、絶望したのを覚えています。
