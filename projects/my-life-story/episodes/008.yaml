panels:
  - number: 1
    purpose: "土曜の無人の事務所で何もせず数時間を過ごした主人公と、後日、自分で仕事を見つけるよう社長に注意された出来事を一枚で伝える"
    visual: "白い余白を大きく残した2001年の小さな構造設計事務所。左下では、少し歪んだ楕円の顔、淡い青緑の丸い縦長胴体、小さなネクタイを持つ若い主人公が、何も載っていない机の前で肩を落として固まっている。主人公の背後にだけ、温かい灰色の小さな指紋状トーンを置く。左奥に二脚の空席と、数字のない時計を最小限の線で描き、土曜の無人の事務所と数時間の経過を示す。右下では、温かい灰色の丸い胴体、太い眉、短いひげ線を持つ社長が、主人公へ向けて短い輪郭付きの腕を一度だけ伸ばして注意している。上部中央にはKritaで大きく歪んだ縦長の吹き出しを一つ置き、『なんの指示がなくても自分で仕事を見つけてやれ！』と入れる。事務所の細部や仕事の山を創作しない。棒人間や一本線の脚にはしない。"
    narration: |-
      仕事が慣れてきたころ、土曜日に出社すると事務所に誰もいませんでした。
      私は数時間「ボーッとして」帰りました。
      後日社長から「なんの指示がなくても自分で仕事を見つけてやれ！」と注意されました。
    dialogue: "なんの指示がなくても自分で仕事を見つけてやれ！"
