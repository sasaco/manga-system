    purpose: "社長の注意を受け、指示がなくても自ら仕事を見つけて動くのがプロだと気付き、能動的に働き始めた決意を伝える"
    visual: "白い余白を大きく残した2001年の構造設計事務所。中央やや左で、少し歪んだ楕円の顔、淡い青緑の丸い縦長胴体、小さなネクタイを持つ若い主人公が、机に向かって能動的に資料や図面を開き、真剣な表情で手を動かしている。主人公の背後には迷いが消えたすっきりとした余白を残す。机の上には自ら広げた無地の図面と計算書を最小限の輪郭で描く。上部中央にはKritaで大きく歪んだ縦長の手描き吹き出しを一つ置き、『1円でもお金をもらったらプロなんだ』と入れる。棒人間や一本線の脚にはしない。余計な背景や装飾は描かない。"
    narration: |-
      1円でもお金をもらったらプロなんだから、プロとして活動することとは「指示されてない」状態でも能動的に働く。
