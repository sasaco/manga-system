    purpose: 納品前日に計算ミスを伝え、完成済みの図面を自分で直せと返されて恐怖で固まった瞬間を描く
    visual: 白い余白の中、淡い青緑の豆型胴体をした主人公が、片手で電話の受話器を耳へ当てたまま硬直している。そばの机には届いた完成図面を映す簡略なモニターが一台だけある。主人公の背後に温かい灰色の点描を置き、短い震え線で恐怖を示す。棒人間にはしない。
    narration: |-
      私が計算を間違えると後ろの工程の人が迷惑します。でもいつも間違いがわかるのが、納品間際なのです。
      ある時、明日納品の計算に間違いがわかり電話で図面担当の厳しい先輩に「間違いました」って電話したら、「じゃあお前が直せよ」って書き終えた図面データが送られてきたことがありました。私は、恐怖で震えて固まりました
    dialogue: じゃあお前が直せよ
