  - number: 1
    purpose: プログラミングで構造設計をつなげたい主人公と、別々の専門ソフトを手作業で使うため全自動化できず、一式も高額だった壁を描く
    visual: 白い余白の中、左側の主人公が期待を込めて短い腕を伸ばし、右側に縦に離れて並ぶ三台の専門ソフト用コンピューターを見ている。各コンピューターには別々の抽象的な構造図形と専用のマウスがあり、互いの間には接続のない空白を残す。手前には大きなくすんだ黄色の南京錠を一つ置き、高価で設計者には一式を揃えにくい壁を示す。主人公は淡い青緑の丸い豆型胴体と歪んだ楕円の顔で描き、棒人間にはしない。
    narration: |-
      プログラミングには興味がありました。構造設計とプログラミングは、相性がいいと思っていました。
      ただ、設計の各工程では別々の専門ソフトを手作業で使います。設計者が全自動設計システムを作ろうにも、必要なソフトを一式そろえるだけで、とても高額になる構造でした。
    dialogue: 全部、つなげられたら……
