  - number: 1
    purpose: 朝出勤して終電で帰る日々の理由が「厳しい〆切に追われるお客様の時間を代行しているから」だと悟った経験を伝える
    visual: 白い余白を大きく残した構図。夜の暗い背景のもと、街灯に照らされた道で、少し歪んだ楕円の顔、淡い青緑の丸い豆型胴体にマスタードイエローのネクタイをした主人公が、疲れた様子でくすんだ黄色のビジネス鞄を提げてトボトボと歩いている。左上には深夜を指す壁時計（または駅の時計）、右上には手描きの歪んだ白いフキダシがあり、縦書きで『〆切が厳しいから…！\n作業を代行してるんだ』と入る。棒人間にはしない。
    narration: |-
      朝出勤して、終電に帰る生活。
      なんでこんなに時間が必要だったかというと「〆切が厳しいから」。
      時間に余裕が無いからお金払って私に依頼するのよ。つまりお客様の作業を代行しているわけ。高度な技術など要らない。
    dialogue: 〆切が厳しいから…！\n作業を代行してるんだ
