  - number: 1
    purpose: 規律正しく精密な仕事を続ける職人集団への憧れと、自分には真似できないという正直な諦めを描く
    visual: 白い余白の中、右側で二人の年上の設計職人が一枚の計算用紙と定規へ静かに集中している。左側では、淡い青緑の豆型胴体と小さな黄色い鞄の主人公が少し離れて見つめる。職人の背後にだけ温かい灰色の点描を置き、規律と職人魂を示す。棒人間にはしない。
    narration: |-
      私に仕事を依頼してくださる会社の1つに「超技能集団」みたいな会社がありました。彼らはまるで宮大工のように精巧で緻密な計算を毎日繰り返しているのです。そこには、規律と正直さを兼ね備えた職人魂がありました。設計の仕事なのに。私は、憧れのようなものを感じましたが、「とてもマネできない」と諦めたのが正直な気持ちです。
    dialogue: |-
      すごいな…
      でも僕には
      マネできない。
