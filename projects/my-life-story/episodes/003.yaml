  - number: 1
    purpose: "新社会人が毎日の生活サイクルをしんどいと感じながら体で覚えていくことを伝える"
    visual: "白い余白を生かした一場面。2001年の朝の満員電車内で、少し歪んだ楕円の顔、短い髪線、淡い青緑の丸い縦長胴体、小さなネクタイ、くすんだ黄色の四角い鞄を持つ若い主人公が中央に立つ。胴体につながる細い輪郭付きの腕で吊革を握り、左右から温かい灰色の丸い胴体を持つ通勤客に押され、眠そうでしんどそうな表情をしている。棒人間や一本線の脚にはしない。両開き扉、窓、頭上の吊革だけで場所を示し、文字や数字、広告、案内表示は描かない。"
    narration: |-
      新社会人として、まず大変だったのは、
      朝起きて、満員電車に乗り、仕事をして帰宅する。
      そのサイクルを一生続けることを、体に叩き込むことでした。

      47歳のおじさんになった今も、最初はみんなと同じ。
      そんな当たり前のことを「しんどい」と感じながら、少しずつ慣れていきました。
