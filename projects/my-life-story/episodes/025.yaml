  - number: 1
    purpose: 独立後の新事業に失敗して廃業し、絶望していた30歳の主人公を、師匠の一言が救った瞬間を描く
    visual: 白い余白を大きく取り、下側の左に片付け途中の仕事場でうなだれる淡い青緑の丸い胴体の主人公を置く。そばには文字のない空の箱と数枚の白紙だけを置き、廃業後の寂しさを示す。主人公の背後には小さな温かい灰色の点描を置く。右には主人公より少し大きい温かい灰色の丸い胴体の師匠を立たせ、主人公へ短い腕と開いた手を差し出す。上部には師匠から出る大きな吹き出しをKritaで一つ入れる。一コマのみ。歪んだ楕円の顔と面積のある豆形の胴体を使い、棒人間にはしない。
    narration: |-
      30歳の時、独立しました。

      世間知らずの私は、それまでとはまったく関係のない事業を始めましたが、何もうまくいきませんでした。
      金なし、コネなし。小さなつながりはできても、焼け石に水でした。

      1社目で天狗になった若者が考えた新事業なんて、軌道に乗るまで何年もかかります。
      あっという間に廃業し、絶望していた頃、師匠に「業務委託としてうちに来い」と拾ってもらいました。
    dialogue: |-
      業務委託として
      うちに来い。
