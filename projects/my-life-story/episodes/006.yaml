    purpose: "発注者から建設コンサル、構造設計専門業者や測量などの各専門業者へ仕事がつながる土木設計のチーム構造と、その中で主人公が橋やトンネルの安全性を構造解析し、300〜1000ページもの計算書の大半を手作りのExcelで作っていた仕事を伝える"
    visual: "白い余白を生かした2001年の土木設計チームと事務所を一つの連続した場面で描く。上部では、くすんだ黄色の丸い胴体の発注者が無地の巻いた図面を温かい灰色の丸い胴体の建設コンサルへ手渡している。建設コンサルは図面を受け取りながら、もう一方の短い腕で手前の主人公へ仕事をつなぐ。近くには三脚の測量機を支える別の専門担当が小さく立つ。手前の主人公は、少し歪んだ楕円の顔、淡い青緑の丸い縦長胴体、小さなネクタイを持ち、2001年らしい厚いCRTモニターとキーボードに向かう。モニターには、文字も数値もない橋の構造線と、すべて空欄の表計算セルだけが見える。机の脇には主人公の胴体に迫るほど分厚い無地の計算書の束が積まれ、手作りのExcelから大量の計算書を作る仕事だと分かる。人物は棒人間にせず、腕は輪郭付きの短い形、脚は丸い胴体へ吸収する。矢印、ラベル、文字、数字、ロゴは描かない。"
    narration: |-
      土木設計は、発注者 → 建設コンサル → 構造設計専門業者 / その他の各専門業者（測量など）

      というチームで仕事をします。私は構造設計専門業者に入社したわけです。
      構造設計とは、橋やトンネルなどの安全性を解析によって確認する仕事です。
      パソコンで構造解析ということをするのですが、ほとんどが手作りのExcelで作っていました。
      300～1000ページある計算書のほとんどをExcelで作っていたわけです。
