  - number: 1
    purpose: "UIがなく黒いターミナル画面を見守るしかない中、数分待った結果がエラーになって絶望した経験を伝える"
    visual: "白い余白を大きく残した2001年の構造設計事務所。左側中央で、少し歪んだ楕円の顔、淡い青緑の丸い豆型胴体、マスタードイエローのネクタイをした若い主人公が、机に身を乗り出して右側の大きなCRTモニターの黒いターミナル画面をじっと見つめている。画面下部にはエラーを示す赤い警告が表示され、主人公は愕然とした表情を浮かべている。机の上にはキーボードと分厚い構造計算書の束。上部中央には手描きの歪んだ白い吹き出しがあり、縦書きで『数分待って… エラー…！？ 無駄になった…』と入る。棒人間や一本線の手足にはしない。余計な装飾は描かない。"
    narration: |-
      構造解析には、プロ向け解析ソフトを使います。2001年当時は、わかりやすいUIはなく、パソコンの黒いterminalに表示される文字を注視して、異常がないか見守っていないといけませんでした。
      数分待って結果を見たらエラーになっててこの"数分が無駄になった"ということが良く起こりました。
    dialogue: "数分待って…\nエラー…！？\n無駄になった…"
