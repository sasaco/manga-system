    purpose: 〆切に間に合わないと分かった時点で依頼主へ正直に連絡する怖さと、その一言に必要な胆力を描く
    visual: 白い余白を大きく取り、下側の左右に電話越しの二人を離して置く。左には淡い青緑の丸い胴体の主人公。受話器を耳に当て、少し頭を下げ、汗と背後の小さな温かい灰色の点描で緊張を示す。右には温かい灰色の丸い胴体の依頼主。太い眉で真剣に聞き、もう片方の手を無地の資料へ添える。中央にはつながった電話線だけを置く。上部には主人公から出る大きな吹き出しをKritaで一つ入れる。一コマのみ。歪んだ楕円の顔と面積のある豆形の胴体を使い、棒人間にはしない。
    narration: |-
      依頼主に一番怒られるのは、「〆切に間に合わないことよりも、間に合わないことが分かった時点で連絡をしないこと」でした。
      正直に「ごめんなさい間に合わないです」と言える。これは思ってるより胆力が必要です。
    dialogue: |-
      ごめんなさい。
      間に合わないです。
