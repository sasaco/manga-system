  - number: 1
    purpose: どんな要求にも必死で答えようとする新人の様子を、コントロールの悪い投手の球を懸命に捕球するキャッチャーの比喩で伝える
    visual: 白い余白を大きく残したグラウンドの構図。手前中央で、少し歪んだ楕円の顔、淡い青緑の丸い豆型胴体にマスタードイエローのキャッチャー防具を着けた若い主人公が、低く体を投げ出して左腕の大きなキャッチャーミットを精一杯伸ばし、枠外へ逸れそうな猛烈な暴投を懸命に捕球しようとしている。奥のマウンドでは、フォームを崩した豆型のピッチャーが投げ終えた姿。左上には手描きの歪んだ白いフキダシがあり、縦書きで『どんな球でも…！ 絶対に後ろへ 逸らさない…っ！』と入る。棒人間や一本線の手足にはしない。
    narration: |-
      師匠に頼まれた仕事を報告しに行くと「あれはどうなってる？」とか「この資料見せて」とか要求されてその都度
      自机に戻ってプリントアウトしてくることをしていたのですが、時間がもったいないし師匠からも「用意しておけよ」って言われてしまうので、
      次第に「師匠の要求に応えるためには、どんな球でも後ろに逸らさず捕球するキャッチャーのように、どんな要求にも必死で答えよう」と思うようになりました。
      新人時代は、上司や関係各所から飛んでくる無茶な要望や予測不能な変更指示の連続でした。
      それはまるで、コントロールの定まらない投手の荒れ球を、必死に体ごと飛びついて捕球するキャッチャーのよう。
      「どんな球でも後ろには逸らさない」と、必死に食らいつく日々でした。
    dialogue: どんな球でも…！\n絶対に後ろへ\n逸らさない…っ！
