panels:
  - number: 1
    purpose: "新人の主人公が、編集済みの分厚い構造計算書をコピー機へ通し、あらかじめページ番号を印字した紙へ複写する方法を思いつき、手書き作業を効率化した出来事を伝える"
    visual: "白い余白を生かした2001年の小さな事務所の一場面。右側に大きく単純化したコピー機があり、上部の自動原稿送りには編集済みの分厚い計算書、中央の排紙口には複写を終えた厚い紙束、下部の開いた給紙トレイには主人公が補充している白い用紙束が見える。左手前の若い主人公は、少し歪んだ楕円の顔と淡い青緑の丸い縦長胴体、小さなネクタイを持ち、片手で給紙しながらもう片方の短い腕でコピー機の無地のボタンを押し、控えめだが得意そうに笑っている。奥では温かい灰色の丸い胴体と太い眉の師匠、くすんだ黄色の丸い胴体のパートの方が、鉛筆を持たずに驚きと喜びの表情で見守っている。大量のページは、紙面への記入ではなく紙束の厚みとずれた端だけで表す。紙面、操作部、機械の外装はすべて無地にし、文字、数字、記号は描かない。棒人間や一本線の脚にはしない。"
    narration: |-
      構造計算書は、印刷後に手作業で編集するため、最後までページ番号が決まりません。
      300〜1000ページもの計算書に、当時は番号を一枚ずつ手書きしていました。

      ある日、新人だった私は思いつきました。
      編集済みの計算書を全ページコピーし、コピー機にはページ番号を印字した紙を入れておけばいい。

      この案は採用され、ページ番号を書く作業を効率化できました。
