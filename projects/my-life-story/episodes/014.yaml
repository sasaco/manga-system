  - number: 1
    purpose: 構造設計屋の本質が「計算書を早く作るプロ」ではなく「依頼人（船長）が決断しやすくする代行者」だと気づいた内省を伝える
    visual: 白い余白を大きく残した空間。中央で、少し歪んだ楕円の顔、淡い青緑の丸い豆型胴体にマスタードイエローのネクタイをした主人公が、分厚い構造計算書を両手に抱えながら、決まづそうに頭の後ろをかいて苦笑いしている。背景には船の舵（操舵輪）を握り方向を決めようとしている船長（依頼人）のシンプルなシルエット。上部中央には手描きの歪んだ白いフキダシがあり、縦書きで『「腕一本で成り上がる」…\n勘違いヤローでした』と入る。棒人間にはしない。
    narration: |-
      構造設計屋は、結局何のプロかというと「構造解析というめんどくさい作業を代行し、船長（依頼人）がこのプロジェクトをどっちの方向に着地させるか決めやすくする」というのが本質なのだと思う。
      私は「早く高品質な計算書を作ること」だと勘違いしてました。「腕一本で成り上がる」みたいなバカな勘違いヤローでしたね
    dialogue: 「腕一本で成り上がる」…\n勘違いヤローでした
