  - number: 1
    purpose: "師匠はサンプル計算書を渡すだけで手取り足取り教えず、主人公が独力で数百ページの数字の出典をたどり切れるようになった修業を伝える"
    visual: "白い余白を大きく残した2001年の小さな構造設計事務所。左下に、少し歪んだ楕円の顔、淡い青緑の丸い縦長胴体、小さなネクタイを持つ若い主人公を小さく描き、困った汗と下がった口を見せる。主人公の背後にだけ温かい灰色の指紋状トーンを薄く置き、そのすぐ横に数百ページを一つの高い無地の紙束として描く。右下には温かい灰色の丸い胴体、太い眉、短いひげ線、縞状の髪を持つ師匠を小さく描き、出口側へ体を向けたまま、一冊の分厚い無地のサンプル計算書を主人公へ手渡している。上部中央には大きく歪んだ縦長の手描き吹き出しを一つ置き、Kritaで『サンプルの a を1から2に変えろ』という台詞を入れる。渡される一冊と主人公横の大量ページを明確に描き分ける。計算表、黄色い糸、説明図、詳細な事務所背景は描かない。棒人間や一本線の脚にはしない。"
    narration: |-
      だから、師匠に手取り足取り教わったことはありません。
      サンプル計算書を渡されて「a を 1 から 2 に変えろ」と言われるだけでした。
      こうして私は、数百ページの計算書にある全ての数字の出典を把握する男になったわけです。
    dialogue: "aを1から2に変えろ"
