    purpose: 貯金のない再出発のため家族と離れ、平日は車中泊をしながら日曜日だけ妻の実家へ帰った主人公の生活を描く
    visual: 白い余白を大きく取り、下半分に夜の駐車場所へ止めた小さな車を横から描く。後部座席の窓越しに、淡い青緑の面積のある横向きの豆形の胴体を丸め、くすんだ黄色の毛布をかけて休む30歳の主人公を見せる。少し歪んだ楕円の顔、短い髪線、短線の目、小さな口、胴体に付いた短い輪郭付きの腕で表し、独立した線の脚は描かない。車のそばに文字のない小さな鞄を一つだけ置き、背後には温かい灰色の疎らな点描を局所的に置く。上部には主人公の小さなつぶやきを入れる大きな吹き出しをKritaで一つ追加する。一コマのみ。
    narration: |-
      師匠の会社へ業務委託として出入りするようになり、心機一転の再スタートとなりました。

      でも、貯金はありませんでした。
      妻と子どもには妻の実家に住んでもらい、私は単身で師匠の会社へ通いました。

      お金がないので、平日は車で寝泊まりし、日曜日に妻の実家へ帰る生活でした。
    dialogue: |-
      日曜には、帰れる。
