  - number: 1
    purpose: 目の前の出来事に意味を与えるのは自分自身であり、悲観的な捉え方の癖を直したいという気づきと決意を描く
    visual: 白い余白を大きくとった構図。少し歪んだ楕円の顔と淡い青緑の丸い豆型胴体にマスタードイエローのネクタイをした主人公が、デスクで静かに自分の手と目の前の小さな空間を見つめ、深思熟考している。背後に温かい灰色の点描トーンが静かに置かれている。棒人間にはしない。
    narration: |-
      目の前で起こっている出来事に意味は無く、それを体験・観察している私が意味を付ける。そこに幸せを見出してもいいし、不幸になることも可能だ。私は悲観的に物事を捉える癖を付けてしまったので「仕事が苦しい」し、「他人を警戒する」。これを残りの人生で治したい
    dialogue: 意味を付け直すのは、\n自分なんだ。
