panels:
  - number: 1
    purpose: 子供の成長を見つめる47歳の私を描き、仕事への怖さから必死に過ごした年月を、現在の静かな安堵で受け止める
    visual: 一つのコマに現在の親子だけを描く。左に大きくなった子供、少し間を空けた右に47歳の私。子供はくすんだ黄色、私は淡い青緑の丸い胴体。私が少し顔を上げて子供を見つめ、下がった肩と小さな柔らかい口元で安堵を表す。子供の性別、人数、卒業や就職など未確認の事実は付け加えず、一人の簡略人物で成長を代表させる。机、赤ちゃん、過去の分身、時間軸の図は置かない。白い余白を残し、台詞も説明文字も入れない。歪んだ楕円の顔と面積のある豆形の胴体を使い、棒人間にはしない。
    narration: |-
      子育てには20年かかる。でも、仕事が20年間順調に続く保証はない。

      早いうちに家族ができた私は、自分の仕事に家族の運命がかかっていると思うと、怖かったです。
      もともとはボーッとした人だったのに、子供が生まれてからは、何やら必死でした。

      47歳になった今、子供も大きくなりました。
      無事に子育てを終えられそうです。
