  - number: 1
    purpose: 早くに家族を持ち、子供を守る責任から仕事へ必死になった若い主人公を描く
    visual: 白い余白を大きく取り、下側で若い主人公が赤ちゃんを片腕で大切に抱えながら、もう片方の短い腕を机の無地の仕事資料へ伸ばす。主人公の表情には小さな不安と決意を出し、背後に局所的な温かい灰色の点描を置く。赤ちゃんは小さな楕円の顔と、くすんだ黄色のおくるみに包まれた丸い形で表す。棒人間にはしない。
    narration: |-
      早いうちに家族ができました。子育てには20年かかりますが、20年間仕事が順調な補償もありません。
      自分の仕事に家族の運命がかかってると思うと怖かったです。
      もともと「ボーッとした人」だったのですが、子供が生まれてからは何やら必死でした。
      47歳になった今、子供も大きくなり、無事子育ては終われそうです。
    dialogue: |-
      この子を、
      守らなきゃ。
